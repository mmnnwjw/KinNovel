[workspace]
resolver = "2"
members = ["crates/kn-render", "crates/kn-platform", "crates/kn-ui", "crates/kn-app", "crates/kn-text", "crates/kn-net", "crates/kn-ime"]
exclude = ["spike-hello", "spike-fbink", "spike-font", "spike-net"]

[workspace.package]
version = "1.6.5"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mmnnwjw/KinNovel"

[workspace.dependencies]
kn-render = { path = "crates/kn-render" }
kn-platform = { path = "crates/kn-platform" }
kn-ui = { path = "crates/kn-ui" }
kn-text = { path = "crates/kn-text" }
kn-ime = { path = "crates/kn-ime" }
libc = "0.2"
log = "0.4"
skrifa = "0.31"
zeno = "0.3"
woff2-patched = "0.4"
html5ever = "=0.39.0"
markup5ever_rcdom = "0.39.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 不在链接时剥离 (zig 的链接器会连符号表一起剥掉): build.sh 之后用 llvm-objcopy --strip-debug,
# 只去掉调试信息、保留符号表, 崩溃日志里的调用栈才有函数名 (+1 MB, zip 里 +0.4 MB)
strip = false
panic = "abort"

[profile.dev]
opt-level = 1
