[package]
name = "kn-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Same choices as rust/spike-net (validated against the real server and on
# the Kindle): rustls with the "ring" provider (aws-lc-rs needs cmake/bindgen
# that zig cc cannot cross-compile), tungstenite without its own TLS features
# (we hand it an already-connected plain or rustls-wrapped TcpStream), and
# flate2's pure-Rust miniz_oxide backend (no system zlib).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "0.26"
rustls-pki-types = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"
sha2.workspace = true

[dev-dependencies]
