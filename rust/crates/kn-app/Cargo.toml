[package]
name = "kn-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kinnovel"
path = "src/main.rs"

[dependencies]
kn-render.workspace = true
kn-platform.workspace = true
kn-ui.workspace = true
kn-text.workspace = true
kn-net = { path = "../kn-net" }
# preserve_order: 写回 config.json 时保持 Python 版的键顺序
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
# 应用内更新: 解压发布包 (raw deflate + CRC 校验)
miniz_oxide = "0.8"
crc32fast = "1"
# 应用内更新: 验证安装包签名
ed25519-dalek = { version = "2", default-features = false }
