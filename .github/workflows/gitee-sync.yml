name: Gitee mirror

# 每次推送 (分支 / 标签) 都把增量同步到 gitee.com/<GITEE_USER>/KinNovel (参考 mmnnwjw/sync-bot)。
# 国内连不上 GitHub 时程序从 Gitee 检查更新、下载安装包; 发行版和附件由 gitee-release.yml 上传。
# 从 GitHub 的机器到 Gitee 只有十几 KB/s: 全量 (~26 MB) 是在 Gitee 网页上「导入仓库」做的, 这里只推增量。
# 需要仓库 Secrets GITEE_USER / GITEE_TOKEN (Gitee 私人令牌, 勾选 projects); 没设置时跳过。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: gitee-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITEE_USER: ${{ secrets.GITEE_USER }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Checkout (all branches and tags)
        if: env.GITEE_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branches and tags
        if: env.GITEE_TOKEN != ''
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -e
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          remote="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/KinNovel.git"
          git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v '^origin$' | grep -v '/HEAD$' | while read -r b; do
            echo "push ${b#origin/}"
            timeout 900 git push --progress "$remote" "refs/remotes/$b:refs/heads/${b#origin/}" --force
          done
          echo "push tags"
          timeout 900 git push --progress "$remote" "refs/tags/*:refs/tags/*" --force
