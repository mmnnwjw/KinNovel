name: Gitee release

# 国内连不上 GitHub 时程序从 Gitee 检查更新、下载安装包, 所以每个版本在 Gitee 镜像上也建一个发行版。
# 代码和标签由 gitee-sync.yml 推过去; 这里等标签出现在 Gitee 上后,
# 把 GitHub 发行版的 zip 和说明 (加 SHA256 行) 发到 Gitee (tools/gitee_release.py)。
# Release 成功后自动运行; 也可以手动对某个标签补发。需要仓库 Secrets GITEE_USER / GITEE_TOKEN。
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "标签, 例如 v1.6.2"
        required: true

permissions:
  contents: read

jobs:
  gitee:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITEE_USER: ${{ secrets.GITEE_USER }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      # 脚本用 main 上最新的; 发行说明从标签里取 (补发旧版本时标签里的脚本可能是旧的)
      - name: Checkout main (tools) with tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download the GitHub release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh release download "$TAG" --pattern "KinNovel-$TAG.zip" --dir build
          git show "$TAG:docs/releases/$TAG.md" > build/notes.md 2>/dev/null || : > build/notes.md
          ls -l build

      - name: Wait for the tag on Gitee (pushed by gitee-sync.yml)
        run: python3 tools/gitee_release.py wait-tag "$TAG"

      - name: Publish the Gitee release
        run: python3 tools/gitee_release.py release "$TAG" "build/KinNovel-$TAG.zip" build/notes.md
