name: Gitee release

# 国内连不上 GitHub 时程序从 Gitee 检查更新、下载安装包, 所以每个版本在 Gitee 镜像上也建一个发行版。
# 代码由 Gitee 的「仓库镜像管理 → Pull 镜像 (自动从 GitHub 同步)」拉过去: GitHub 推送后 webhook 通知 Gitee,
# Gitee 服务器自己拉 (从这里往 Gitee 推只有十几 KB/s)。镜像不同步发行版, 这里等标签出现在 Gitee 上后,
# 把 GitHub 发行版的 zip 和说明 (加 SHA256 行) 发到 Gitee (tools/gitee_release.py)。
# Release 成功后自动运行; 也可以手动对某个标签补发。需要仓库 Secrets GITEE_USER / GITEE_TOKEN。
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "标签, 例如 v1.6.2"
        required: true

permissions:
  contents: read

jobs:
  gitee:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITEE_USER: ${{ secrets.GITEE_USER }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout the tag (tools + release notes)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Download the GitHub release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh release download "$TAG" --pattern "KinNovel-$TAG.zip" --dir build
          ls -l build

      - name: Wait for the tag on Gitee (pull mirror)
        run: python3 tools/gitee_release.py wait-tag "$TAG"

      - name: Publish the Gitee release
        run: python3 tools/gitee_release.py release "$TAG" "build/KinNovel-$TAG.zip" "docs/releases/$TAG.md"
